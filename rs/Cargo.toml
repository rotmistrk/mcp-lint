[package]
name = "mcp-lint-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mcp-lint-rs"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
