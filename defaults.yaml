# Default lint configuration
# Override per-project with .mcp-lint.yaml in project root

max_method_length: 40
max_nesting_depth: 3
max_line_width: 120
max_params: 7
max_consecutive_same_type: 2
max_code_lines_per_file: 240

# Language-specific overrides
go:
  forbid_panic: true
  forbid_type_assertions: true
  forbid_exported_fields: true
  forbid_swallowed_errors: true
  max_types_per_file: 1

rust:
  forbid_unwrap: true
  forbid_expect: true
  forbid_panic: true
  forbid_pub_fields: true
  max_structs_per_file: 1

typescript:
  forbid_any: true
  forbid_class_components: true
  forbid_wait_for_timeout: true
  forbid_public_properties: true
  forbid_empty_catch: true
  max_classes_per_file: 1

cpp:
  forbid_raw_new: true
  forbid_c_casts: true
  forbid_public_members: true
  forbid_empty_catch: true
  max_classes_per_file: 1

java:
  forbid_raw_types: true
  forbid_public_fields: true
  max_classes_per_file: 1
